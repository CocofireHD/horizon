# The upload direction of the sync: `crowdin upload translations` reads the folder this file names,
# so the staged copies of the lang files sit in a folder of their own. The download writes into the
# folder `crowdin.yml` names, and the importer turns both into the lang files and the review record —
# a language the download carries nothing for therefore cannot keep the staged text.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: ".."
preserve_hierarchy: true
files:
  - source: /crates/horizon-client/assets/horizon/lang/en_us.json
    translation: /l10n/game-staged/%locale_with_underscore%.json
