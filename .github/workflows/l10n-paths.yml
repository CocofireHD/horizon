name: l10n
# The required check a translations pull request carries (docs/release-flow.md, "Merging"): whatever it
# holds, it may change language files and their review record and nothing else.
#
# It matters because `l10n/crowdin` is the one pull request that may merge itself. A later push could
# add a workflow, a tool or a manifest to that branch after the run that queued it, so the branch's shape
# is checked on the pull request itself, by name, rather than only by the run that opens it. It passes on
# every other pull request, so main's ruleset can require the same check for all of them.
#
# Two details keep the check honest:
# - it runs **main's** copy of `tools/l10n_merge_guard.py`, not the branch's: a pull request that rewrote
#   the guard would otherwise grade its own work;
# - it also answers the merge queue (`merge_group`), because a required check that never reports there
#   leaves every queued pull request waiting. That run checks nothing: the queue's content is main plus
#   pull requests that each passed this check on their own commit.
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: l10n-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  paths:
    name: l10n (changed paths)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the pull request's commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'l10n/crowdin'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check the changed paths against main's guard
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'l10n/crowdin'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TOKEN: ${{ github.token }}
        run: |
          # One commit of the base is enough for `git diff` and for the file the branch started from.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch --depth=1 origin "$BASE"
          # The branch may have rewritten the guard; the copy that decides is the one main has.
          if ! git cat-file -e "$BASE:tools/l10n_merge_guard.py" 2>/dev/null; then
            echo "::error::main has no tools/l10n_merge_guard.py at $BASE, so there is nothing to check this branch against."
            exit 1
          fi
          git show "$BASE:tools/l10n_merge_guard.py" > "$RUNNER_TEMP/l10n_merge_guard.py"
          python3 "$RUNNER_TEMP/l10n_merge_guard.py" --root "$GITHUB_WORKSPACE" --base "$BASE" --paths-only
