name: crowdin
# The whole translation sync (docs/translations.md, "Crowdin"): main's English text goes up when it
# changes, the project's translations come down as one pull request, and the strings a proofreader
# approved are recorded as reviewed in tools/lang_review/game.
#
# Inert until the repository has the project: the variable CROWDIN_ENABLED=true and the secrets
# CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN (Settings → Secrets and variables → Actions). A
# manual run says which half to do; a push uploads the English text only, the nightly run downloads.
#
# Two jobs, because of the token. `import` runs Crowdin's action and the import with the built-in
# token and no way to write; it hands the change on as a patch (deletions included) together with the
# export the proofreaders approved. `pull-request` is the only job that holds `CROWDIN_PAT` — a
# fine-grained token for this repository with `contents` and `pull requests` write and no ruleset
# bypass — because a push made with `github.token` starts no workflows (GitHub's rule), so the
# pull request's `verify` would never run.
#
# With the variable CROWDIN_AUTOMERGE=true that job also waits for the pull request's checks and adds
# it to main's merge queue (docs/release-flow.md, "Merging"). It queues nothing unless the whole diff
# is language files and `tools/l10n_merge_guard.py` finds every changed string proofread: a string no
# proofreader approved keeps the pull request for a Team member, as before.
on:
  push:
    branches: [main]
    paths:
      - crates/horizon-client/assets/horizon/lang/en_us.json
      - crowdin.yml
      - .github/crowdin-approved.yml
      - tools/crowdin_import.py
      - tools/l10n_merge_guard.py
      - .github/workflows/crowdin.yml
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "upload: English text up only. download: translations down and a pull request. both: the two."
        type: choice
        default: both
        options: [both, upload, download]
      upload_translations:
        description: "First run only: send the translations already in the repository up to Crowdin."
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  import:
    concurrency:
      group: crowdin
      cancel-in-progress: false
    if: vars.CROWDIN_ENABLED == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      # No credential kept: this job only reads, and the one push happens in `pull-request`, which has
      # its own token for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The run's own commit: both jobs measure from the same base, whatever `main` is by the
          # time the second one starts.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Stage the translations the repository already has
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'upload'))
        # Crowdin reads translations from the `translation` folder in crowdin.yml, which is empty on a
        # fresh checkout; the first run has to put the repository's own text there first. A folder of
        # its own, so a language the download carries nothing for cannot keep the staged text.
        run: python3 tools/crowdin_import.py --stage --stage-dir l10n/game-staged
      - name: Upload the English text
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'upload'))
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: ${{ inputs.upload_translations == true }}
          # The staged copies live in their own folder: `-t` names it here rather than in a second
          # config file, because the action adds `--config` to the command itself and two of those
          # would be a coin toss. The download below writes into the folder crowdin.yml names.
          upload_translations_args: -s crates/horizon-client/assets/horizon/lang/en_us.json -t l10n/game-staged/%locale_with_underscore%.json
          download_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      - name: Download every translation
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'download'))
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          config: crowdin.yml
          upload_sources: false
          download_translations: true
          # Without this Crowdin writes the English sentence into every untranslated string, and the
          # import would replace translations with English (tools/crowdin_import.py guards that too).
          skip_untranslated_strings: true
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      - name: Download the proofread translations
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'download'))
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          config: .github/crowdin-approved.yml
          upload_sources: false
          download_translations: true
          export_only_approved: true
          skip_untranslated_strings: true
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      - name: Write the lang files and the review record
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'download'))
        run: |
          python3 tools/crowdin_import.py --check
          python3 tools/crowdin_import.py --translations l10n/game --approved l10n/game-approved
          python3 tools/lang_coverage.py --summary
      - name: Write what changed as a patch
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'download'))
        run: |
          # The change itself, deletions included: a folder of files cannot say that a record is gone,
          # and copying it over a newer `main` would quietly undo whatever landed there since.
          git add -A -- crates/horizon-client/assets/horizon/lang tools/lang_review/game tools/lang_review/crowdin
          git -c core.quotePath=false diff --cached --binary --no-renames > l10n.patch
          git -c core.quotePath=false diff --cached --stat
      - name: Hand the patch on to the job that pushes
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'download'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: change
          path: l10n.patch
          retention-days: 1
      - name: Hand the proofreaders' export on too
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'download'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved
          # What proofreaders approved in this run: the job below checks every changed string against
          # it, because a mark in the repository's record is not their word on its own.
          path: l10n/game-approved
          retention-days: 1
          if-no-files-found: ignore
  pull-request:
    needs: import
    if: needs.import.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'download')))
    concurrency:
      group: crowdin-pull-request
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    # The wait below is at most 55 minutes, and what it waits for is the pull request's own checks.
    timeout-minutes: 75
    permissions:
      # For the run with no CROWDIN_PAT: `github.token` pushes the branch then, and this is what lets it.
      contents: write
      pull-requests: write
    steps:
      # No credential in .git/config: this job unpacks files that a third-party action in `import`
      # produced, and the PAT is put on the push alone (see below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The run's own commit: both jobs measure from the same base, whatever `main` is by the
          # time the second one starts.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Take the change the import job wrote
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: change
          # Somewhere else, and read as data: nothing a job in `import` produced is written to this
          # tree before the guard below has said where the patch would write.
          path: ${{ runner.temp }}/change
      - name: Take the export the proofreaders approved
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved
          path: ${{ runner.temp }}/approved
      - name: Apply the change, once every path in it is allowed
        env:
          PATCH: ${{ runner.temp }}/change/l10n.patch
        run: |
          if [ ! -s "$PATCH" ]; then
            echo "the import wrote no change, so there is nothing to push"
            exit 0
          fi
          # This checkout is the run's own commit of main, so the guard reading it is main's copy: a
          # patch may only touch the language files and the record, and nothing else reaches the branch.
          python3 tools/l10n_merge_guard.py --patch "$PATCH" --paths-only
          git apply --index --whitespace=nowarn "$PATCH"
          git status --short
      - name: Check which token this run has
        env:
          PAT: ${{ secrets.CROWDIN_PAT }}
          AUTOMERGE: ${{ vars.CROWDIN_AUTOMERGE }}
        run: |
          # A push made with github.token starts no workflows, so the pull request's `verify` would never
          # run and the queue could never take it: with the switch on, the PAT is not optional.
          if [ -z "$PAT" ] && [ "$AUTOMERGE" = "true" ]; then
            echo "::error::CROWDIN_AUTOMERGE is set but CROWDIN_PAT is not, so the pull request's checks would never start and it could never merge. Add the secret, or set CROWDIN_AUTOMERGE to false."
            exit 1
          fi
          if [ -z "$PAT" ]; then
            echo "::notice::no CROWDIN_PAT: the push and the pull request use github.token, which can push but starts no workflows, so the pull request's checks will not start on their own and a maintainer has to re-run them."
          fi
      - name: Open or update the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.CROWDIN_PAT || github.token }}
        run: |
          # Staged by `git apply --index`, deletions included; with no change this is quiet.
          if git diff --cached --quiet; then
            echo "no translation changed, so no pull request"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B l10n/crowdin
          git commit -m "translations from Crowdin"
          # The token is handed to git for this one command and taken back out: no secret in
          # .git/config, no secret in the remote URL, nothing an earlier step could have read.
          git config --local credential.helper '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          git push --force origin l10n/crowdin
          git config --local --unset credential.helper
          # The commit this run pushed: the guard measures its diff, and the queue entry is bound to it.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          body="Translations from [Crowdin](https://crowdin.com/project/horizon-client), written by
          \`tools/crowdin_import.py\` in \`.github/workflows/crowdin.yml\` from run
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The text comes from
          the project; the reviewed marks are its proofreading (docs/translations.md, \"Crowdin\").
          Only translations change here."
          # The open pull request for this branch, and only that one: a merged or closed one is no target.
          # `--head` takes a branch name, not `owner:branch`: gh documents that the syntax is not
          # supported. What keeps a fork's branch of the same name out is the filter, and the count keeps
          # two of ours from being chosen between.
          open=$(gh pr list --head l10n/crowdin --base main --state open --json number,isCrossRepository) || {
            echo "::error::cannot list the open pull requests for l10n/crowdin"; exit 1; }
          open=$(echo "$open" | jq '[.[] | select(.isCrossRepository == false)]')
          count=$(echo "$open" | jq 'length')
          if [ "$count" -gt 1 ]; then
            echo "::error::$count open pull requests for l10n/crowdin, expected one: a person has to sort them out"
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            gh pr create --base main --head l10n/crowdin --title "tooling: translations from Crowdin" --body "$body"
          else
            gh pr edit "$(echo "$open" | jq -r '.[0].number')" --title "tooling: translations from Crowdin" --body "$body"
          fi
      - name: Check what the pull request changes
        id: guard
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          BASE: ${{ github.sha }}
          APPROVED: ${{ runner.temp }}/approved
        run: |
          # docs/release-flow.md, "Merging": the paths of the whole diff and every changed string, the
          # latter against the export this run's proofreading produced rather than a mark in a file.
          if [ -z "$SHA" ]; then
            echo "nothing was pushed, so there is nothing to check"
            exit 0
          fi
          if python3 tools/l10n_merge_guard.py --base "$BASE" --approved "$APPROVED"; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the pull request stays open for a Team member, as every translation pull request did before"
          fi
      - name: Queue the pull request to merge itself
        if: vars.CROWDIN_AUTOMERGE == 'true' && steps.guard.outputs.approved == 'true'
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.CROWDIN_PAT }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          # `--head` takes a branch name, not `owner:branch`; the filter keeps a fork's branch of the same
          # name out, and the count keeps two of ours from being picked from.
          prs=$(gh pr list --head l10n/crowdin --base main --state open --json number,headRefOid,id,isCrossRepository) || {
            echo "::error::cannot read the open pull requests for l10n/crowdin"; exit 1; }
          prs=$(echo "$prs" | jq '[.[] | select(.isCrossRepository == false)]')
          count=$(echo "$prs" | jq 'length')
          if [ "$count" -ne 1 ]; then
            echo "::error::expected one open pull request for l10n/crowdin, found $count"
            exit 1
          fi
          number=$(echo "$prs" | jq -r '.[0].number')
          head=$(echo "$prs" | jq -r '.[0].headRefOid')
          id=$(echo "$prs" | jq -r '.[0].id')
          # The branch may have moved on since this run pushed it; then this run is not the one to queue.
          if [ "$head" != "$SHA" ]; then
            echo "the branch is at $head, not at this run's $SHA: leaving the pull request alone"
            exit 0
          fi
          # main's merge queue takes a pull request that is green now: it does not wait, and it cannot be
          # armed ahead of time, because this repository can't use auto-merge at all (`autoMergeAllowed`
          # is false, so `gh pr merge --auto` has nothing to switch). So this job waits for the checks
          # and then adds the entry, `expectedHeadOid` binding it to the commit it pushed.
          #
          # The two checks that decide are asked for by name, on this run's own commit: a poll that only
          # asks "is anything still running" can look at a partial set and call it green.
          deadline=$((SECONDS + 3300))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?filter=latest&per_page=100" 2>/dev/null) || runs=""
            seen=0 running=0 passed=0 red=0
            if [ -n "$runs" ]; then
              red=$(echo "$runs" | jq '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required")] | length')
              seen=$(echo "$runs" | jq '[.check_runs[] | select(.name == "verify" or .name == "l10n (changed paths)")] | length')
              running=$(echo "$runs" | jq '[.check_runs[] | select((.name == "verify" or .name == "l10n (changed paths)") and .status != "completed")] | length')
              passed=$(echo "$runs" | jq '[.check_runs[] | select((.name == "verify" or .name == "l10n (changed paths)") and .status == "completed" and .conclusion == "success")] | length')
            fi
            if [ "$red" -gt 0 ]; then
              echo "::notice::a check is red, so the pull request waits for a Team member, as before"
              exit 0
            fi
            if [ "$seen" -eq 2 ] && [ "$running" -eq 0 ]; then
              if [ "$passed" -eq 2 ]; then
                break
              fi
              echo "::notice::verify or l10n (changed paths) did not pass, so the pull request waits for a Team member"
              exit 0
            fi
            echo "the checks are not reported yet, or still running; waiting"
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::notice::verify and l10n (changed paths) are not both green after 55 minutes, so the pull request waits for a Team member"
              exit 0
            fi
            sleep 30
          done
          state=$(gh pr view "$number" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" != "CLEAN" ]; then
            echo "::notice::the checks pass but the pull request is $state (a change request, a conflict or a missing review), so it waits for a Team member"
            exit 0
          fi
          if ! out=$(gh api graphql -f query='
            mutation($id: ID!, $oid: GitObjectID!) {
              enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $oid}) {
                mergeQueueEntry { position } } }' \
            -f id="$id" -f oid="$SHA" 2>&1); then
            echo "::notice::the merge queue did not take it: $out"
            exit 0
          fi
          echo "l10n/crowdin is in main's merge queue at position $(echo "$out" | jq -r '.data.enqueuePullRequest.mergeQueueEntry.position')"
